{% include '_head.html' %}
<body>
<a class="auth-brand brand" href="/"><img src="/images/unipath-symbol.webp" alt="" width="36" height="36"><span>UniPath</span></a>
<main class="auth-page"><section class="auth-card"><div class="section-kicker">ACCOUNT RECOVERY</div><h1>Choose a new password.</h1><p>Reset links expire after 30 minutes and can only be used once.</p>
    <form id="reset-password-form" class="auth-form"><input type="hidden" name="token" value="{{ resetToken }}"><label>New password<input type="password" name="password" autocomplete="new-password" required minlength="8" maxlength="72" placeholder="At least 8 characters"></label><p class="form-response" role="status" aria-live="polite"></p><button class="button" type="submit">Save new password →</button></form>
    <div class="auth-links"><a href="/login">← Back to log in</a></div></section></main>
{% include '_chat.html' %}</body>
</html>

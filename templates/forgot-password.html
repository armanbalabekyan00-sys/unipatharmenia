{% include '_head.html' %}
<body>
<a class="auth-brand brand" href="/"><img src="/images/unipath-symbol.webp" alt="" width="36" height="36"><span>UniPath</span></a>
<main class="auth-page"><section class="auth-card"><div class="section-kicker">ACCOUNT RECOVERY</div><h1>Reset your password.</h1><p>Enter the email address on your account. If it matches, we’ll send a secure reset link that expires in 30 minutes.</p>
    <form id="forgot-password-form" class="auth-form"><label>Email address<input type="email" name="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label><p class="form-response" role="status" aria-live="polite"></p><button class="button" type="submit">Send reset link →</button></form>
    <div class="auth-links"><a href="/login">← Back to log in</a></div></section></main>

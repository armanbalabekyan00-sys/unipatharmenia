{% include 'hy/_head.html' %}
<body>
<a class="auth-brand brand" href="/"><img src="/images/unipath-symbol.webp" alt="" width="36" height="36"><span>UniPath</span></a>
<main class="auth-page"><section class="auth-card"><div class="section-kicker">ՀԱՇՎԻ ՎԵՐԱԿԱՆԳՆՈՒՄ</div><h1>Սահմանեք նոր գաղտնաբառ։</h1><p>Վերականգնման հղումը գործում է 30 րոպե և կարող է օգտագործվել մեկ անգամ։</p>

    <div class="auth-links"><a href="/login">← Վերադառնալ մուտքի էջ</a></div></section></main>

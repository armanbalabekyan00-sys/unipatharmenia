<section class="study-chat" aria-label="UniPath study assistant">
    <button class="chat-launcher" id="chat-launcher" type="button" aria-expanded="false" aria-controls="chat-panel" aria-label="Բացել UniPath-ի զրույցը">◌<span>Զրույց</span></button>
    <div class="chat-panel" id="chat-panel" hidden>
        <div class="chat-panel-header"><div><strong>UniPath-ի օգնական</strong><span>Օգնում ենք արտասահմանում սովորելու հարցերով</span></div><button id="chat-close" type="button" aria-label="Փակել զրույցը">×</button></div>
        <div class="chat-messages" id="chat-messages" role="log" aria-live="polite"><p class="chat-message assistant-message">Բարև։ Ի՞նչ կցանկանայիք իմանալ։ Կօգնեմ ուսումնասիրել ծրագրերը, երկրները, ծախսերն ու դիմելու գործընթացը։</p></div>
        <form id="chat-form" class="chat-form"><label class="visually-hidden" for="chat-input">Ձեր հարցը</label><input id="chat-input" name="message" required maxlength="1000" placeholder="Գրեք ձեր հարցը…"><button type="submit" aria-label="Ուղարկել հաղորդագրությունը">↑</button></form>
    </div>
</section>
